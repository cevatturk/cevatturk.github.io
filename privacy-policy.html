        function getInitialLang() {
            const urlParams = new URLSearchParams(window.location.search);
            const pLang = urlParams.get('lang');
            if (pLang && PRIVACY_DATA[pLang.toLowerCase()]) {
                return pLang.toLowerCase();
            }
            const navLang = (navigator.language || navigator.userLanguage || 'tr').toLowerCase();
            if (navLang.startsWith('tr')) return 'tr';
            if (navLang.startsWith('ko')) return 'ko';
            if (navLang.startsWith('ja')) return 'ja';
            if (navLang.startsWith('zh')) return 'zh';
            if (navLang.startsWith('ru')) return 'ru';
            if (navLang.startsWith('it')) return 'it';
            if (navLang.startsWith('es')) return 'es';
            if (navLang.startsWith('fr')) return 'fr';
            return 'en';
        }

        function renderPolicy(lang) {
            const data = PRIVACY_DATA[lang] || PRIVACY_DATA.en;
            document.documentElement.lang = lang;
            document.title = "Marinext 2100 - " + data.title;

            // Highlight active tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const metaEl = document.getElementById('metaInfo');
            if (metaEl && data.meta) metaEl.innerHTML = data.meta;

            const area = document.getElementById('contentArea');
            let html = '<div class="highlight-box">' + data.highlight + '</div>';
            data.sections.forEach(sec => {
                html += '<h2>' + sec.h + '</h2>';
                html += '<p>' + sec.p + '</p>';
                if (sec.items && sec.items.length > 0) {
                    html += '<ul>';
                    sec.items.forEach(it => {
                        html += '<li>' + it + '</li>';
                    });
                    html += '</ul>';
                }
            });
            area.innerHTML = html;
        }

        document.getElementById('langTabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (btn) {
                const lang = btn.getAttribute('data-lang');
                if (lang) {
                    renderPolicy(lang);
                    // update URL without reload
                    const url = new URL(window.location);
                    url.searchParams.set('lang', lang);
                    window.history.replaceState({}, '', url);
                }
            }
        });

        // Initialize on load
        renderPolicy(getInitialLang());
    </script>
</body>
</html>
